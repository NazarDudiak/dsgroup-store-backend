services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: change-me
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://store:change-me@db:5432/store
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports: ["8000:8000"]
    volumes: [media_data:/app/media]
    depends_on: [db]
volumes:
  postgres_data:
  media_data:
